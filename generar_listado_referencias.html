<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generar Listado de Referencias - Innovapack</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
    h1 { color: #0091C7; }
    .btn { background: #0091C7; color: white; border: none; padding: 15px 30px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-right: 10px; }
    .btn:hover { background: #007BA7; }
    .status { margin-top: 20px; padding: 15px; border-radius: 5px; }
    .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
    th { background: #0091C7; color: white; position: sticky; top: 0; }
    tr:nth-child(even) { background: #f2f2f2; }
    .preview-container { max-height: 400px; overflow-y: auto; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>📋 Generar Listado de Referencias de Producto Terminado</h1>
  <p>Este generador creará un archivo CSV con todas las referencias de bolsas y láminas de producto terminado.</p>
  
  <button class="btn" onclick="generarCSV(',')">✅ Generar CSV (delimitado por comas)</button>
  <button class="btn" onclick="generarCSV(';')">✅ Generar CSV (delimitado por punto y coma)</button>
  
  <p style="margin-top: 10px;"><em>💡 Si Excel agrupa todo en una columna, usa la versión con punto y coma.</em></p>
  
  <div id="status"></div>
  <div id="preview" class="preview-container"></div>

  <script src="shared/data.js"></script>
  <script src="shared/sku_maestro.js"></script>
  
  <script>
    function extraerPesoReferencia(referencia) {
      const match = referencia.match(/(\d+(?:\.\d+)?)\s*kg/i);
      return match ? match[1] + 'KG' : '';
    }

    function calcularPesoUnidad(referencia, tipo) {
      const ref = referencia.toLowerCase();
      
      // Bolsa de agua (todas pesan 0.026 kg)
      if (tipo === 'Bolsa de agua') {
        return '0.026';
      }
      
      // Bolsa valvulada
      if (tipo === 'Bolsa valvulada') {
        if (ref.includes('40kg') || ref.includes('40 kg')) {
          return '0.08'; // Valvulada 40kg
        }
        return '0.05'; // Valvulada 25kg o menor
      }
      
      // Bolsa abierta
      if (tipo === 'Bolsa abierta') {
        // Estuco 25kg
        if (ref.includes('estuco') && (ref.includes('25kg') || ref.includes('25 kg'))) {
          return '0.07';
        }
        // Pegante, porcelanato, cerámico
        if (ref.includes('pegante') || ref.includes('porcelanato') || ref.includes('porcelanico') || 
            ref.includes('ceramico') || ref.includes('cerámica')) {
          return '0.05';
        }
        // Alimentos 2.5kg
        if (ref.includes('2.5kg') || ref.includes('2,5kg')) {
          return '0.012';
        }
        // Alimentos 1kg
        if (ref.includes('1kg') || ref.includes('1 kg')) {
          return '0.008';
        }
        return '0.05'; // Por defecto para bolsas abiertas
      }
      
      // Flow Pack
      if (tipo === 'Flow Pack') {
        // Flow Pack 2kg
        if (ref.includes('2kg') || ref.includes('2 kg')) {
          return '0.017';
        }
        // Flow Pack 1kg
        if (ref.includes('1kg') || ref.includes('1 kg')) {
          return '0.012';
        }
        return '0.017'; // Por defecto
      }
      
      // Lámina (sin peso unitario estándar)
      return '';
    }

    function generarCSV(delimitador = ',') {
      const statusDiv = document.getElementById('status');
      const previewDiv = document.getElementById('preview');
      
      statusDiv.innerHTML = '<div class="info">⏳ Procesando datos...</div>';
      
      // Tipos válidos de producto terminado
      const tiposValidos = ['Bolsa valvulada', 'Bolsa abierta', 'Bolsa de agua', 'Lámina', 'Flow Pack'];
      
      const referencias = [];
      const itemsVistos = new Set();
      
      // Convertir SKU_MAESTRO (objeto) a array de items
      const skuItems = Object.keys(window.SKU_MAESTRO || {});
      
      // Procesar cada SKU
      skuItems.forEach(itemSiesa => {
        // Evitar duplicados
        if (itemsVistos.has(itemSiesa)) return;
        
        // Verificar si tiene clasificación
        const clasif = window.CLASIFICACION_SKU?.[itemSiesa];
        if (!clasif) return;
        
        // Verificar si es producto terminado
        if (clasif.bodega !== 'Producto Terminado') return;
        
        const categoria = clasif.categoria || '';
        
        // Verificar si es un tipo válido
        if (!tiposValidos.includes(categoria)) return;
        
        itemsVistos.add(itemSiesa);
        
        // Buscar referencia en el catálogo
        let referencia = '';
        const catItem = window.DEFAULT_CATALOG?.find(c => c.siesa === itemSiesa);
        if (catItem) {
          referencia = catItem.referencia || '';
        }
        
        // Extraer peso de referencia
        const pesoRef = extraerPesoReferencia(referencia);
        
        // Calcular peso por unidad
        const pesoUnidad = calcularPesoUnidad(referencia, categoria);
        
        // Obtener cliente desde SKU_MAESTRO
        const skuInfo = window.SKU_MAESTRO?.[itemSiesa];
        const cliente = skuInfo?.cli || '';
        
        referencias.push({
          item: itemSiesa,
          referencia: referencia,
          cliente: cliente,
          tipo: categoria,
          pesoRef: pesoRef,
          pesoUnidad: pesoUnidad
        });
      });
      
      // Ordenar por tipo y luego por referencia
      referencias.sort((a, b) => {
        if (a.tipo !== b.tipo) return a.tipo.localeCompare(b.tipo);
        return a.referencia.localeCompare(b.referencia);
      });
      
      // Generar CSV
      let csv = '\uFEFF'; // BOM para UTF-8
      
      // Encabezados
      if (delimitador === ';') {
        csv += 'Item Siesa;Referencia;Cliente;Tipo;Referencia peso;Peso por unidad\n';
      } else {
        csv += 'Item Siesa,Referencia,Cliente,Tipo,Referencia peso,Peso por unidad\n';
      }
      
      referencias.forEach(ref => {
        // Para punto y coma, no necesitamos escapar con comillas
        if (delimitador === ';') {
          // Reemplazar punto y coma en los datos por coma
          const limpiar = (texto) => texto ? texto.replace(/;/g, ',') : '';
          csv += `${limpiar(ref.item)};${limpiar(ref.referencia)};${limpiar(ref.cliente)};${limpiar(ref.tipo)};${limpiar(ref.pesoRef)};${limpiar(ref.pesoUnidad)}\n`;
        } else {
          // Para comas, escapar con comillas dobles
          const escapar = (texto) => {
            if (!texto) return '';
            return texto.includes(',') ? `"${texto}"` : texto;
          };
          csv += `${escapar(ref.item)},${escapar(ref.referencia)},${escapar(ref.cliente)},${escapar(ref.tipo)},${escapar(ref.pesoRef)},${escapar(ref.pesoUnidad)}\n`;
        }
      });
      
      // Crear blob y descargar
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      
      const nombreArchivo = delimitador === ';' 
        ? 'referencias_producto_terminado_puntocoma.csv'
        : 'referencias_producto_terminado.csv';
      
      link.setAttribute('href', url);
      link.setAttribute('download', nombreArchivo);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      // Mostrar resumen
      const resumen = {};
      referencias.forEach(ref => {
        resumen[ref.tipo] = (resumen[ref.tipo] || 0) + 1;
      });
      
      let resumenHTML = '<div class="success">';
      resumenHTML += `<h3>✅ Archivo generado exitosamente</h3>`;
      resumenHTML += `<p><strong>Total de referencias:</strong> ${referencias.length}</p>`;
      resumenHTML += '<p><strong>Resumen por tipo:</strong></p><ul>';
      
      Object.entries(resumen).sort((a, b) => b[1] - a[1]).forEach(([tipo, count]) => {
        resumenHTML += `<li>${tipo}: <strong>${count}</strong></li>`;
      });
      
      resumenHTML += `</ul><p>El archivo <strong>${nombreArchivo}</strong> ha sido descargado.</p>`;
      resumenHTML += `<p><em>Delimitador usado: ${delimitador === ';' ? 'punto y coma (;)' : 'coma (,)'}</em></p></div>`;
      
      statusDiv.innerHTML = resumenHTML;
      
      // Mostrar preview de primeras 30 filas
      let previewHTML = '<h3>Vista previa (primeras 30 filas):</h3><table>';
      previewHTML += '<tr><th>Item Siesa</th><th>Referencia</th><th>Cliente</th><th>Tipo</th><th>Ref. peso</th><th>Peso/unidad</th></tr>';
      
      referencias.slice(0, 30).forEach(ref => {
        previewHTML += `<tr><td>${ref.item}</td><td>${ref.referencia}</td><td>${ref.cliente || '-'}</td><td>${ref.tipo}</td><td>${ref.pesoRef}</td><td>${ref.pesoUnidad}</td></tr>`;
      });
      
      previewHTML += '</table>';
      previewDiv.innerHTML = previewHTML;
    }
  </script>
</body>
</html>
